<!doctype html>
<!--
  OG-картинка 1200×630 → site/public/og.png. Рендер из папки site/:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --window-size=1200,630 --hide-scrollbars \
    --virtual-time-budget=3000 --screenshot=public/og.png "file://$PWD/scripts/og.html"
  Шрифты — локальные woff2 из node_modules/@fontsource (нужен npm ci). Справа — статичный кадр HeroGrid
  (как при prefers-reduced-motion: робот под меткой M-0712, пройденные метки жёлтые).
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG 1200×630</title>
<style>
  /* Unbounded 700/800: кириллица, латиница и latin-ext (в нём знак ₽ U+20BD) */
  @font-face { font-family: Unbounded; font-weight: 700; src: url(../node_modules/@fontsource/unbounded/files/unbounded-cyrillic-700-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Unbounded; font-weight: 700; src: url(../node_modules/@fontsource/unbounded/files/unbounded-latin-ext-700-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: Unbounded; font-weight: 700; src: url(../node_modules/@fontsource/unbounded/files/unbounded-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: Unbounded; font-weight: 800; src: url(../node_modules/@fontsource/unbounded/files/unbounded-cyrillic-800-normal.woff2) format('woff2'); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: Unbounded; font-weight: 800; src: url(../node_modules/@fontsource/unbounded/files/unbounded-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #15171A; color: #F2F0EA; }
  .og { position: relative; width: 1200px; height: 630px; }
  .brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; font: 800 17px/1 Unbounded, sans-serif; letter-spacing: .03em; }
  .mark { width: 26px; height: 26px; background: repeating-linear-gradient(-45deg, #FFC629 0 5px, #111 5px 10px); }
  .copy { position: absolute; left: 64px; top: 206px; }
  .tag { margin: 0; font: 400 16px/1 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: #FFC629; }
  h1 { margin: 26px 0 0; font: 700 54px/1.06 Unbounded, sans-serif; letter-spacing: -0.01em; text-transform: uppercase; }
  h1 em { font-style: normal; color: #FFC629; }
  .art { position: absolute; left: 724px; top: 150px; width: 460px; height: 380px; }
  .hazard { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: repeating-linear-gradient(-45deg, #FFC629 0 14px, #111 14px 28px); }
</style>
</head>
<body>
<div class="og">
  <div class="brand"><span class="mark"></span>БЕСПИЛОТНЫЙ ПОГРУЗЧИК</div>
  <div class="copy">
    <p class="tag">// Роботизация склада без остановки</p>
    <h1>Водитель стоит<br><em>от&nbsp;200&#8239;000&#8239;₽</em><br>в&nbsp;месяц.<br>Робот&nbsp;—&nbsp;нет.</h1>
  </div>

  <!-- HeroGrid, статичный кадр: маршрут 810 ед., робот на 270-й (под M-0712), след = первые 270 ед. -->
  <svg class="art" viewBox="0 0 460 380" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="fx"><stop offset="0" stop-color="#000" /><stop offset=".14" stop-color="#fff" /><stop offset=".86" stop-color="#fff" /><stop offset="1" stop-color="#000" /></linearGradient>
      <linearGradient id="fy" x2="0" y2="1"><stop offset="0" stop-color="#000" /><stop offset=".14" stop-color="#fff" /><stop offset=".86" stop-color="#fff" /><stop offset="1" stop-color="#000" /></linearGradient>
      <mask id="mx"><rect width="460" height="380" fill="url(#fx)" /></mask>
      <mask id="my"><rect width="460" height="380" fill="url(#fy)" /></mask>
    </defs>
    <g mask="url(#mx)"><g mask="url(#my)" stroke="#2A2E34"><path d="M0 60H460M0 160H460M0 260H460M0 360H460M60 0V380M180 0V380M300 0V380M420 0V380" /></g></g>
    <g fill="#F2F0EA" opacity=".45">
      <rect x="52" y="52" width="16" height="16" /><rect x="172" y="52" width="16" height="16" /><rect x="292" y="52" width="16" height="16" /><rect x="412" y="52" width="16" height="16" />
      <rect x="52" y="152" width="16" height="16" /><rect x="292" y="152" width="16" height="16" /><rect x="412" y="152" width="16" height="16" />
      <rect x="52" y="252" width="16" height="16" /><rect x="292" y="252" width="16" height="16" /><rect x="412" y="252" width="16" height="16" />
    </g>
    <g fill="#FFC629"><rect x="172" y="152" width="16" height="16" /><rect x="172" y="252" width="16" height="16" /></g>
    <path d="M60 310 L180 310 L180 110 L300 110 L300 210 L420 210 L420 60" stroke="#FFC629" stroke-width="2" stroke-dasharray="6 6" opacity=".7" />
    <path d="M60 310 L180 310 L180 110 L300 110 L300 210 L420 210 L420 60" stroke="#FFC629" stroke-width="2" stroke-dasharray="810" stroke-dashoffset="540" opacity=".9" />
    <g transform="translate(180 160) rotate(-90)">
      <rect x="-16" y="-11" width="32" height="22" fill="#FFC629" /><rect x="16" y="-8" width="16" height="4" fill="#FFC629" /><rect x="16" y="4" width="16" height="4" fill="#FFC629" /><circle cx="-6" cy="0" r="4" fill="#111" />
    </g>
    <path d="M160 147V140H167M200 147V140H193M200 173V180H193M160 173V180H167" stroke="#FFC629" stroke-width="1.5" />
    <g font-family="JetBrains Mono, monospace" font-size="10" fill="#8C9098">
      <text x="206" y="153">M-0712</text><text x="326" y="153">M-0934</text><text x="20" y="340">шаг 6 м · метка 50×50 см</text>
    </g>
  </svg>

  <div class="hazard"></div>
</div>
</body>
</html>
